name: Setup Phoenix-RTOS build environment
description: Install prerequisites for building Phoenix-RTOS

runs:
  using: composite
  steps:
    - name: Install prerequisites
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          mtd-utils \
          autoconf \
          texinfo \
          genext2fs \
          libtool \
          libhidapi-dev \
          python3
