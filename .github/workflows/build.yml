name: Build

on:
  workflow_dispatch:
  push:
    tags: ["*.*.*-*"]

jobs:
  build-toolchain:
    name: Build for ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-24.04
            ubuntu: noble
          - host: ubuntu-26.04
            ubuntu: resolute

    uses: ./.github/workflows/build-ubuntu.yml
    with:
      host: ${{ matrix.host }}
      ubuntu: ${{ matrix.ubuntu }}

  release:
    name: Make the release
    runs-on: ubuntu-latest
    needs: build-toolchain
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Fetch build output
        uses: actions/download-artifact@v7
        with:
          path: debs
          pattern: arm-phoenix-*-*
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          files:
            debs/arm-phoenix-*.deb
