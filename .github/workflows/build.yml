name: Build

on:
  workflow_dispatch:
  push:
    tags: ["*.*.*-*", "99-*"]

jobs:
  build-toolchain:
    name: Build the toolchain for Ubuntu 24.04
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
  
      - name: Install prerequisities
        run: sudo apt-get install build-essential mtd-utils autoconf texinfo genext2fs libtool libhidapi-dev python3

      - name: Build the toolchain
        run: make toolchain
  
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: arm-phoenix-toolchain
          path: _out/arm-phoenix-toolchain*


  release:
    name: Make the release
    runs-on: ubuntu-latest
    needs: build-toolchain
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Fetch build output
        uses: actions/download-artifact@v4

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          files:
            arm-phoenix-toolchain/arm-phoenix-toolchain_${{ github.ref_name }}~noble.deb
